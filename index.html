<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X4 Plan Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header>
          <div class="eyebrow" data-i18n="eyebrow"></div>
          <h1 id="plan-name">—</h1>
          <select id="plan-select" class="plan-select" data-i18n-aria-label="choosePlan" hidden></select>
        </header>

        <div class="stats">
          <div class="stat"><b id="stat-modules">0</b><span data-i18n="statModules"></span></div>
          <div class="stat"><b id="stat-production">0</b><span data-i18n="statProduction"></span></div>
          <div class="stat"><b id="stat-size">0</b><span data-i18n="statSize"></span></div>
        </div>

        <section>
          <h2 data-i18n="moduleTypes"></h2>
          <ul class="legend" id="legend"></ul>
        </section>

        <section id="production-section">
          <h2 data-i18n="production"></h2>
          <ul class="prodlist" id="production-list"></ul>
        </section>

        <section id="workforce-section">
          <h2 data-i18n="workforce"></h2>
          <p class="balance" id="workforce-balance"></p>
        </section>

        <section>
          <h2 data-i18n="selectedModule"></h2>
          <div class="detail" id="detail"></div>
        </section>

        <section class="tools">
          <button class="btn primary" id="open-file" type="button" data-i18n="openXml"></button>
          <button class="btn" id="export-file" type="button" data-i18n="exportXml"></button>
          <button class="btn" id="fit" type="button" data-i18n="fit"></button>
          <label class="toggle"><input type="checkbox" id="show-links" checked /> <span data-i18n="links"></span></label>
          <input type="file" id="file-input" accept=".xml,text/xml" hidden />
          <p class="error" id="error" role="alert" hidden></p>
        </section>

        <p class="note" data-i18n-html="note"></p>

        <div class="lang" id="lang-select" role="radiogroup" data-i18n-aria-label="language"></div>
      </aside>

      <main class="view" id="view">
        <div id="canvas-host"></div>
        <div class="tip" id="tip" hidden></div>
        <div class="menu" id="context-menu" role="menu" hidden></div>
        <div class="hint" data-i18n="hint"></div>
        <div class="drop" id="drop" hidden data-i18n="drop"></div>
      </main>
    </div>
    <dialog class="export" id="export-dialog" aria-labelledby="export-title">
      <header>
        <h2 id="export-title" data-i18n="exportTitle"></h2>
        <form method="dialog"><button class="close" data-i18n-aria-label="close">×</button></form>
      </header>
      <div class="export-scope" role="radiogroup" data-i18n-aria-label="exportTitle" hidden></div>
      <textarea readonly spellcheck="false" data-i18n-aria-label="exportTitle"></textarea>
      <footer>
        <p class="export-status" role="status"></p>
        <button class="btn export-copy" type="button" data-i18n="copyXml"></button>
        <button class="btn primary export-save" type="button" data-i18n="saveXml"></button>
      </footer>
    </dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
